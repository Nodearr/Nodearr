<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Nodearr</title>
  <!-- Two arcs round a node: yours on the left, a friend's on the right, and the node between them
       split in two, each half the colour of the arc it faces. Drawn by build/logo/make-logo.py. -->
  <circle cx="256" cy="256" r="240" fill="#EEF2F3"/>
  <defs>
    <clipPath id="yours"><rect x="0" y="0" width="249" height="512"/></clipPath>
    <clipPath id="friends"><rect x="263" y="0" width="249" height="512"/></clipPath>
  </defs>
  <g transform="rotate(-35 256 256)">
    <g fill="none" stroke-width="54" stroke-linecap="round">
      <path d="M147.60 135.61 A162 162 0 0 0 147.60 376.39" stroke="#1E2A32"/>
      <path d="M364.40 135.61 A162 162 0 0 1 364.40 376.39" stroke="#14B8A6"/>
    </g>
    <circle cx="256" cy="256" r="74" fill="#1E2A32" clip-path="url(#yours)"/>
    <circle cx="256" cy="256" r="74" fill="#14B8A6" clip-path="url(#friends)"/>
  </g>
</svg>
