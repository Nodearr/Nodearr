[package]
name = "nodearr-iroh-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
license = "GPL-3.0-only"
publish = false
description = "S2 spike: direct-only file transfer over iroh, with relayed-byte accounting"

[dependencies]
# Pinned exactly: the spike's findings are about this release's behaviour.
iroh = "=1.3.0"
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
