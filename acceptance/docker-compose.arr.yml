# Pinned Sonarr, Radarr and Prowlarr that share one /downloads folder with a Nodearr running on the
# host, for the acceptance scripts. Each script names its own compose project and passes the API
# keys in an env file it writes under .run/. Started as the S1 spike's (ADR 0010).
name: nodearr-acceptance

x-arr-common: &arr-common
  restart: "no"
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  sonarr:
    <<: *arr-common
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls327@sha256:dffc730adcb8b4f4342792fbb27fcad9c62fb8660523f2aeb082416980d7fe0c
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY}
      SONARR__AUTH__METHOD: External
      SONARR__LOG__ANALYTICSENABLED: "false"
    volumes:
      - sonarr-config:/config
      - tv:/tv
      - ./.run/downloads:/downloads
    ports:
      - "127.0.0.1:18989:8989"

  radarr:
    <<: *arr-common
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls319@sha256:7dfd049e79c00b16fbc29c3f5d96a9e7b9e73a23930b4c5b3c4541d60b366814
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY}
      RADARR__AUTH__METHOD: External
      RADARR__LOG__ANALYTICSENABLED: "false"
    volumes:
      - radarr-config:/config
      - movies:/movies
      - ./.run/downloads:/downloads
    ports:
      - "127.0.0.1:17878:7878"

  prowlarr:
    <<: *arr-common
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163@sha256:f9151e5bc1025c6d0a630d503210cdcb6bb55a7cc098562609d96a408d838902
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY}
      PROWLARR__AUTH__METHOD: External
      PROWLARR__LOG__ANALYTICSENABLED: "false"
    volumes:
      - prowlarr-config:/config
    ports:
      - "127.0.0.1:19696:9696"

volumes:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  tv:
  movies:
