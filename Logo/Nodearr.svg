<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nodearr icon</title>
  <desc id="desc">A light circular badge containing a teal connected-node glyph forming a stylized letter N.</desc>

  <defs>
    <radialGradient id="badgeFill" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#F5F7F8"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </radialGradient>

    <linearGradient id="tealStroke" x1="120" y1="112" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="45%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <radialGradient id="nodeFill" cx="37%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="48%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>

    <radialGradient id="nodeCore" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#22D3C5"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </radialGradient>

    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.13"/>
    </filter>

    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0F766E" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- light app badge -->
  <circle cx="256" cy="256" r="210" fill="url(#badgeFill)" stroke="#D5D9DC" stroke-width="10" filter="url(#badgeShadow)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

  <!-- connected N glyph -->
  <g stroke="url(#tealStroke)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 155 V357"/>
    <path d="M150 155 L256 256 L362 357"/>
    <path d="M362 155 V357"/>
  </g>

  <!-- node halos -->
  <g fill="#FFFFFF" opacity="0.92">
    <circle cx="150" cy="155" r="42"/>
    <circle cx="150" cy="357" r="42"/>
    <circle cx="256" cy="256" r="45"/>
    <circle cx="362" cy="155" r="42"/>
    <circle cx="362" cy="357" r="42"/>
  </g>

  <!-- teal nodes -->
  <g filter="url(#nodeShadow)">
    <circle cx="150" cy="155" r="31" fill="url(#nodeFill)"/>
    <circle cx="150" cy="357" r="31" fill="url(#nodeFill)"/>
    <circle cx="256" cy="256" r="34" fill="url(#nodeFill)"/>
    <circle cx="362" cy="155" r="31" fill="url(#nodeFill)"/>
    <circle cx="362" cy="357" r="31" fill="url(#nodeFill)"/>
  </g>

  <!-- darker inner centers, closer to the richer first draft -->
  <g opacity="0.55">
    <circle cx="150" cy="155" r="18" fill="url(#nodeCore)"/>
    <circle cx="150" cy="357" r="18" fill="url(#nodeCore)"/>
    <circle cx="256" cy="256" r="20" fill="url(#nodeCore)"/>
    <circle cx="362" cy="155" r="18" fill="url(#nodeCore)"/>
    <circle cx="362" cy="357" r="18" fill="url(#nodeCore)"/>
  </g>

  <!-- subtle highlight to avoid the over-flattened second pass -->
  <g opacity="0.32">
    <circle cx="140" cy="145" r="9" fill="#FFFFFF"/>
    <circle cx="246" cy="246" r="10" fill="#FFFFFF"/>
    <circle cx="352" cy="145" r="9" fill="#FFFFFF"/>
  </g>
</svg>
