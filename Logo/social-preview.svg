<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Nodearr: your friends' libraries, in your Arr apps</title>
  <!-- Drawn by build/logo/make-logo.py. Uploaded by hand: Settings > General > Social preview. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B2A28"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- The mark, large and faint, off to the right, behind everything -->
  <g transform="translate(700 -60) scale(1.5)" opacity="0.06">
    <defs>
    <clipPath id="faint-yours"><rect x="0" y="0" width="249" height="512"/></clipPath>
    <clipPath id="faint-friends"><rect x="263" y="0" width="249" height="512"/></clipPath>
  </defs>
  <g transform="rotate(-35 256 256)">
    <g fill="none" stroke-width="54" stroke-linecap="round">
      <path d="M147.60 135.61 A162 162 0 0 0 147.60 376.39" stroke="#EEF2F3"/>
      <path d="M364.40 135.61 A162 162 0 0 1 364.40 376.39" stroke="#14B8A6"/>
    </g>
    <circle cx="256" cy="256" r="74" fill="#EEF2F3" clip-path="url(#faint-yours)"/>
    <circle cx="256" cy="256" r="74" fill="#14B8A6" clip-path="url(#faint-friends)"/>
  </g>
  </g>

  <!-- The icon, as it is everywhere else -->
  <g transform="translate(120 180) scale(0.62)">
    <circle cx="256" cy="256" r="240" fill="#1E2A32"/>
    <circle cx="256" cy="256" r="236" fill="none" stroke="#14B8A6" stroke-opacity="0.35" stroke-width="8"/>
    <defs>
    <clipPath id="icon-yours"><rect x="0" y="0" width="249" height="512"/></clipPath>
    <clipPath id="icon-friends"><rect x="263" y="0" width="249" height="512"/></clipPath>
  </defs>
  <g transform="rotate(-35 256 256)">
    <g fill="none" stroke-width="54" stroke-linecap="round">
      <path d="M147.60 135.61 A162 162 0 0 0 147.60 376.39" stroke="#EEF2F3"/>
      <path d="M364.40 135.61 A162 162 0 0 1 364.40 376.39" stroke="#14B8A6"/>
    </g>
    <circle cx="256" cy="256" r="74" fill="#EEF2F3" clip-path="url(#icon-yours)"/>
    <circle cx="256" cy="256" r="74" fill="#14B8A6" clip-path="url(#icon-friends)"/>
  </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="470" y="318" font-size="132" font-weight="700" letter-spacing="-4" fill="#F0F6FC">Node<tspan fill="#5EEAD4">arr</tspan></text>
    <text x="474" y="380" font-size="34" fill="#C9D1D9">Your friends' libraries, in your Arr apps.</text>
    <text x="474" y="436" font-size="24" font-weight="600" letter-spacing="1.5" fill="#5EEAD4">SONARR · RADARR · LIDARR · WHISPARR · PROWLARR</text>
  </g>
</svg>
